<html lang="en">
<body>

<script>
    let color = parseInt(prompt("Ingrese una letra entre y, r o b"));
    switch (color) {
        case 1:
            alert("El numero ingresado es uno");
            break;
        case 2:
            alert("El numero ingresado es dos");
            break;
        case 3:
            alert("El numero ingresado es tres");
            break;
        case 4:
            alert("El numero ingresado es cuatro");
            break;
        case 5:
            alert("El numero ingresado es cinco");
            break;
        default:
            alert("NUMERO fuera de rango");
            break;
    }
</script>

</body>
</html>
